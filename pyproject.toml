[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-instagram-library"
version = "0.1.0"
description = "PIL — Personal Instagram Library: a local-first saved-post knowledge base with a read-only MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paul Poulose" }]
keywords = ["mcp", "model-context-protocol", "instagram", "knowledge-base", "sqlite", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp<2",
]
urls = { Homepage = "https://github.com/pjpoulose/PIL", Repository = "https://github.com/pjpoulose/PIL" }

[project.scripts]
pil-mcp = "pil.mcp_server:main"
pil-ingest = "pil.ingest_saved:main"
pil-extract = "pil.extract_content:main"
pil-tag = "pil.tag_all:main"
pil-export-web = "pil.export_web:main"
pil-export-html = "pil.export_html:main"
pil-export-pwa = "pil.export_pwa:main"
pil-publish-pwa = "pil.publish_pwa:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pil = ["data/*.sql"]
